  # SERVICES DE STOCKAGE ET BASE DE DONNÉES EN DÉVELOPPEMENT LOCAL
  #
  # 1. MinIO (Stockage d'objets compatible S3) :
  #    - Port 9000 : API S3 principale pour l'envoi et la lecture de fichiers.
  #    - Port 9001 : Interface web de gestion (http://localhost:9001).
  #    - Volume 'minio_data' : Persistance des fichiers téléversés.
  #
  # 2. PostgreSQL (Base de données relationnelle via Doctrine) :
  #    - Basé sur l'image légère postgres:16-alpine.
  #    - Inclut un healthcheck automatique pour s'assurer que la base répond.
  #    - Volume 'database_data' : Persistance des données PostgreSQL.

services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data


###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
  minio_data:
###< doctrine/doctrine-bundle ###
