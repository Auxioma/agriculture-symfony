name: CD

on:
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]
    branches: [master]
  # * Permet de redéclencher un déploiement à la main depuis l'onglet Actions (ex. après un
  # * incident, pour redéployer le même master une fois le correctif mergé) -- absent avant, la
  # * seule façon de relancer un déploiement était de pousser un nouveau commit.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # * Évite qu'une connexion SSH bloquée (réseau, prompt inattendu) fasse tourner le job jusqu'à
    # * la limite par défaut du runner (plusieurs heures).
    timeout-minutes: 10
    # * Rattache ce job à un environnement GitHub nommé "production" : sans configuration
    # * supplémentaire c'est un no-op, mais ça permet d'ajouter des règles de protection
    # * (validation manuelle avant déploiement) depuis Réglages > Environments du dépôt, sans
    # * retoucher ce fichier.
    environment: production

    env:
      SSHPASS: ${{ secrets.APP_PASS }}

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      # ! Remplace -o StrictHostKeyChecking=no (qui désactive toute vérification et expose à une
      # ! attaque MITM sur la connexion) : on récupère la clé d'hôte réelle du serveur au début de
      # ! CE run et on ne fait confiance qu'à elle pour la suite. Moins fort qu'une clé d'hôte
      # ! épinglée une fois pour toutes en secret, mais très supérieur à une désactivation totale.
      # ! "|| true" : ssh-keyscan peut renvoyer un code de sortie non nul même en ayant récupéré une
      # ! clé valide (ex. un des types de clé qu'il essaie en plus échoue) -- confirmé en prod, ce
      # ! comportement faisait échouer tout le déploiement avant même la connexion réelle. Le
      # ! "test -s" qui suit vérifie explicitement qu'au moins une clé a été écrite ; si le fichier
      # ! est vide, on échoue quand même ici plutôt que de laisser échouer l'étape Deploy plus loin
      # ! avec un message moins clair.
      - name: Enregistrer la clé d'hôte SSH du serveur
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 ${{ secrets.APP_HOST }} >> ~/.ssh/known_hosts 2>&1 || true
          test -s ~/.ssh/known_hosts

      # ! Chemin absolu, sans "~/" : le compte SSH utilisé ($APP_USER) est un compte système/admin
      # ! générique (home rempli de fichiers Plesk/MariaDB/npm, aucun fichier de l'application) --
      # ! PAS un utilisateur "webspace" jailé dont le home serait déjà la racine du site. Confirmé
      # ! par un diagnostic (whoami/$HOME/ls) le 2026-09-15 : le home ne contient aucune trace de
      # ! l'application, donc "~/var/www/vhosts/..." pointait vers un chemin qui n'a jamais existé.
      # ! Bootstrap Git conditionnel : le dossier de prod contenait déjà l'application (composer.json,
      # ! src/, vendor/, .env.local...) mais sans dépôt Git initialisé -- déployé à l'origine par un
      # ! autre moyen (upload manuel), jamais par ce pipeline (confirmé le 2026-09-15, "git pull"
      # ! échouait avec "not a git repository"). Le bloc "if [ ! -d .git ]" ne s'exécute qu'une seule
      # ! fois : une fois .git créé, tous les runs suivants sautent directement au "git pull" normal.
      # ! "checkout -f -B master origin/master" aligne les fichiers SUIVIS par Git sur origin/master ;
      # ! .env.local/var/vendor restent intacts (gitignorés, jamais touchés par un checkout Git).
      - name: Deploy
        run: |
          sshpass -e ssh -p 22 ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} << 'EOF'
            set -e

            cd /var/www/vhosts/trouvemoi.com/admin-agriculture.trouvemoi.com

            # ! Le dossier appartient à un autre utilisateur Unix que celui de la connexion SSH
            # ! ($APP_USER) -- protection standard de Git (CVE-2022-24765) qui refuse sinon toute
            # ! opération ici ("detected dubious ownership"). safe.directory déclare ce dossier
            # ! précis comme fiable ; --global l'écrit dans le ~/.gitconfig de $APP_USER (persiste
            # ! entre les runs, mais idempotent -- se répéter sans effet de bord si déjà présent).
            git config --global --add safe.directory /var/www/vhosts/trouvemoi.com/admin-agriculture.trouvemoi.com

            if [ ! -d .git ]; then
              echo "Aucun dépôt Git ici -- initialisation unique."
              git init
              git remote add origin https://github.com/Auxioma/agriculture-symfony.git
              git fetch origin master
              git checkout -f -B master origin/master
            fi

            git pull origin master
            composer install --no-interaction --prefer-dist --optimize-autoloader
            composer dump-env prod
            bin/console doctrine:migrations:migrate --no-interaction --env=prod
            bin/console cache:clear --no-interaction --env=prod
            bin/console cache:warmup --no-interaction --env=prod
            bin/console assets:install public --no-interaction --env=prod
            bin/console importmap:install --no-interaction --env=prod
            bin/console asset-map:compile --env=prod
          EOF
