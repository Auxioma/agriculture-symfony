framework:
    rate_limiter:
        # ? cahier_des_charges_devops_trouvemoi_agri.pdf §10 : "protection brute force" sur l'authentification.
        # ? Utilisé dans AuthController::login (ou l'authenticator JWT) avec une clé combinant IP + email.
        login_attempts:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
