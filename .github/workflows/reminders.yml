name: Reminders

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    env:
      SSHPASS: ${{ secrets.APP_PASS }}

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      # ! Même correctif que .github/workflows/main.yml : ssh-keyscan peut renvoyer un code de
      # ! sortie non nul même en récupérant une clé valide -- "|| true" + "test -s" évite qu'un
      # ! échec partiel casse tout le job (incident réel constaté sur le déploiement, voir TODO.md),
      # ! tout en remplaçant StrictHostKeyChecking=no (qui désactivait toute vérification).
      - name: Enregistrer la clé d'hôte SSH du serveur
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 ${{ secrets.APP_HOST }} >> ~/.ssh/known_hosts 2>&1 || true
          test -s ~/.ssh/known_hosts

      # ! --env=dev -> --env=prod : même bug que main.yml avant correction (le serveur ne doit
      # ! jamais tourner en environnement dev, voir docs/runbooks/deploiement.md).
      - name: Envoyer les rappels d'expiration
        run: |
          sshpass -e ssh -p 22 ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} << 'EOF'
            set -e
            cd /var/www/vhosts/trouvemoi.com/admin-agriculture.trouvemoi.com
            php bin/console app:send-expiry-reminders --env=prod --no-interaction
          EOF

      # * Même serveur, même job : republication des demandes récurrentes (RecurringRequestRule), une fois
      # * par jour comme les rappels d'expiration -- pas besoin d'un workflow séparé pour une seconde commande cron.
      - name: Republier les demandes récurrentes
        run: |
          sshpass -e ssh -p 22 ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} << 'EOF'
            set -e
            cd /var/www/vhosts/trouvemoi.com/admin-agriculture.trouvemoi.com
            php bin/console app:run-recurring-requests --env=prod --no-interaction
          EOF