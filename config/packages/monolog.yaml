monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # * Alerte "API 5xx" du cahier des charges DevOps -- approximation MVP (pas de vrai calcul de
            # * taux d'erreur sur 5 minutes, qui demanderait un outil de métriques hors périmètre MVP) :
            # * un email par exception non rattrapée (niveau "critical", pas "error", qui couvre aussi des
            # * erreurs utilisateur normales comme une 422 de validation -- ça enverrait un mail à chaque
            # * mauvaise saisie client sinon).
            alert_mail:
                type: fingers_crossed
                action_level: critical
                handler: mailer_nested
                excluded_http_codes: [404, 405]
            mailer_nested:
                type: symfony_mailer
                from_email: '%env(MAILER_FROM_ADDRESS)%'
                to_email: ['louisboutetcamille@gmail.com']
                subject: 'Erreur critique — TrouveMoi Agri'
